<div class="card" style="width: 18rem; padding: 0.5rem; height: 12rem">
  <i style="font-size: 40px; margin: auto" [class]="cardData.icon"></i>

  <div style="margin: 0 auto" class="card-body">
    <h5 class="card-title">{{ cardData.title }}</h5>
  </div>
  <div class="card-text">
    <p>{{ cardData.description }}</p>
  </div>
</div>
