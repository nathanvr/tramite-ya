<div class="d-flex flex-column vh-100 vw-100">
  <!-- Header -->
  <header
    class="bg-dark text-white text-center py-3 d-flex justify-content-between align-items-center px-4"
  >
    <h1 class="h4">{{ userName }}</h1>
    <button (click)="logout()" class="btn btn-light">Cerrar sesion</button>
  </header>

  <!-- Body con scroll -->
  <main
    class="flex-grow-1 overflow-auto p-4 bg-light d-flex flex-wrap gap-4 justify-content-center"
  >
    @for (card of cardInfo; track $index) {
    <a
      style="width: 18rem; display: flex; cursor: pointer; height: 12rem"
      (click)="openForm(card.form)"
    >
      <app-options-card [cardData]="card"></app-options-card>
    </a>

    }
  </main>
  @if (formStatus == 'registerMovement') {
  <div
    class="modal fade show"
    tabindex="-1"
    role="dialog"
    style="display: block; background: rgba(0, 0, 0, 0.5)"
  >
    <div class="modal-dialog modal-lg" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Formulario de Transacciones</h5>
          <button
            type="button"
            class="btn-close"
            (click)="closeModal()"
          ></button>
        </div>
        <div class="modal-body">
          <!-- Aquí va el contenido del formulario -->
          <app-register-form></app-register-form>
        </div>
      </div>
    </div>
  </div>
  } @if (formStatus == 'getRecords') {
  <div
    class="modal fade show"
    tabindex="-1"
    role="dialog"
    style="display: block; background: rgba(0, 0, 0, 0.5)"
  >
    <div class="modal-dialog modal-fullscreen" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Actualización de estados</h5>
          <button
            type="button"
            class="btn-close"
            (click)="closeModal()"
          ></button>
        </div>
        <div class="modal-body">
          <!-- Aquí va el contenido del formulario -->
          <app-status-update-form></app-status-update-form>
        </div>
      </div>
    </div>
  </div>
  }

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <small>© 2025 Nathan</small>
  </footer>
</div>
